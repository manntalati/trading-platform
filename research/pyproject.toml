[project]
name = "tp-research"
version = "0.1.0"
description = "Research code and Phase 0 learning exercises."
requires-python = ">=3.12"
dependencies = ["tp-core"]

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_research"]
