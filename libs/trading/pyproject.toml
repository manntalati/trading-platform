[project]
name = "tp-trading"
version = "0.1.0"
description = "Strategy contract and event-driven engine: the same strategy code backtests and paper-trades."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "tp-core",
]

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_trading"]
