[project]
name = "tp-ingest"
version = "0.1.0"
description = "Market data ingest jobs: vendor adapters, daily bars, option chain snapshots."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "tp-core",
    "typer>=0.12",
]

[project.scripts]
tp-data = "tp_ingest.cli:main"

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_ingest"]
