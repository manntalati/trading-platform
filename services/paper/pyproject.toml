[project]
name = "tp-paper"
version = "0.1.0"
description = "Paper trading on Alpaca's paper account: proposals, approval, submission, fills, reconciliation."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43",
    "pandas>=2.2",
    "tp-core",
    "tp-ingest",
    "tp-risk",
    "tp-strategies",
    "tp-trading",
    "typer>=0.12",
]

[project.scripts]
tp-paper = "tp_paper.cli:main"

[tool.uv.sources]
tp-core = { workspace = true }
tp-ingest = { workspace = true }
tp-risk = { workspace = true }
tp-strategies = { workspace = true }
tp-trading = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_paper"]
