[project]
name = "tp-api"
version = "0.1.0"
description = "Dashboard API: REST over the lake, portfolio, ideas and paper trading, plus a live WebSocket feed."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "fastapi>=0.115",
    "tp-broker",
    "tp-core",
    "tp-paper",
    "tp-strategies",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tp-api = "tp_api.cli:main"

[tool.uv.sources]
tp-broker = { workspace = true }
tp-core = { workspace = true }
tp-paper = { workspace = true }
tp-strategies = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_api"]
