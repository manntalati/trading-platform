[project]
name = "tp-broker"
version = "0.1.0"
description = "Read-only brokerage connections (SnapTrade for Fidelity, Alpaca paper) and portfolio sync."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "snaptrade-python-sdk>=11",
    "tp-core",
    "typer>=0.12",
]

[project.scripts]
tp-broker = "tp_broker.cli:main"

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_broker"]
