[project]
name = "tp-risk"
version = "0.1.0"
description = "Pre-trade risk: the plan's hard limits, kill switch and drawdown monitor, outside strategy code."
requires-python = ">=3.12"
dependencies = [
    "tp-core",
    "tp-trading",
    "typer>=0.12",
]

[project.scripts]
tp-risk = "tp_risk.cli:main"

[tool.uv.sources]
tp-core = { workspace = true }
tp-trading = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_risk"]
