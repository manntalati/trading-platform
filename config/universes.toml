# Symbol universes used by the ingest jobs. Alpaca symbols (class shares use a dot: BRK.B).
#
# Your own tickers go in config/universes.local.toml (git-ignored), for example:
#     [research]
#     symbols = ["PLTR", "SHOP"]
# Those get daily bars, daily option chains and a place in the options research.
#
# Survivorship warning: these are today's large, liquid names chosen with hindsight. Backtests on
# this list overstate what a strategy would have earned picking from the universe as it looked at
# the time (delisted and shrunken companies are missing). Fine for learning and plumbing; not
# fine for cross-sectional research claims.

[bars]
# 20 ETFs: broad US equity, international, bonds, T-bills, real estate, commodities, gold, credit.
# SPY/EFA/IEF/VNQ/DBC are Faber's 5-asset GTAA portfolio; AGG and BIL (T-bills, the cash hurdle)
# are for dual momentum and time-series momentum. The last six are 3x leveraged, daily-reset
# funds for strategy 6 (high risk by design).
etfs = [
    "SPY", "QQQ", "IWM", "DIA",
    "EFA", "EEM",
    "IEF", "TLT", "HYG", "AGG", "BIL",
    "VNQ", "DBC", "GLD",
    "TQQQ", "UPRO", "SOXL", "TNA", "FAS", "TMF",
]
# 38 large-cap stocks across sectors.
stocks = [
    "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "AVGO", "AMD", "INTC",
    "ORCL", "CRM", "ADBE", "CSCO", "NFLX",
    "BRK.B", "JPM", "BAC", "V", "MA",
    "UNH", "LLY", "JNJ", "MRK", "ABBV",
    "XOM", "CVX",
    "PG", "KO", "PEP", "COST", "WMT", "HD", "MCD", "NKE", "DIS",
    "CAT", "BA",
]

[options]
# Daily chain snapshots: build our own options history from day one, and the names the options
# research can pick contracts on. Liquid, tight markets across sectors: index and sector ETFs,
# mega caps, and the most actively traded single-stock options. Every name here also gets daily
# bars (tp-data bars daily backfills a new one on its first run).
underlyings = [
    # index, rates, gold and emerging markets
    "SPY", "QQQ", "IWM", "DIA", "TLT", "GLD", "EEM",
    # sectors and themes
    "XLF", "XLE", "SMH", "XLK", "XLV", "XLY", "XLI", "XBI", "KRE", "GDX", "FXI", "ARKK",
    # technology
    "AAPL", "MSFT", "NVDA", "AMD", "AVGO", "ORCL", "CRM", "ADBE", "INTC", "QCOM", "AMAT",
    "LRCX", "MRVL", "ARM", "SMCI", "DELL", "PANW", "CRWD", "SNOW", "NET", "DDOG", "ANET", "MSTR",
    # communication services
    "GOOGL", "META", "NFLX", "DIS", "CMCSA", "T", "VZ", "SPOT", "ROKU", "SNAP", "PINS", "RBLX",
    # consumer
    "AMZN", "TSLA", "HD", "LOW", "MCD", "SBUX", "NKE", "F", "GM", "RIVN", "ABNB", "DASH", "BABA",
    "PDD", "COST", "WMT", "TGT", "PG", "KO", "PEP",
    # financials
    "JPM", "BAC", "GS", "MS", "C", "WFC", "SCHW", "AXP", "V", "MA", "PYPL", "COIN",
    # health care
    "LLY", "UNH", "MRK", "ABBV", "AMGN", "MRNA",
    # energy, industrials, materials
    "XOM", "CVX", "OXY", "SLB", "CAT", "BA", "GE", "LMT", "UPS", "UBER", "FCX", "NEM",
]
# Expirations further out than this are skipped. Two years covers LEAPS (the January expiries
# one and two years out) for the options research.
max_dte = 800
# Strikes kept, as a share of the underlying's price: everything the research prices (deep
# in-the-money LEAPS to far out-of-the-money wings) without the strikes nobody trades. The names
# you hold are always stored whole, so every contract you own is priced.
strike_window = [0.5, 1.6]

[dashboard]
# Always streamed live on the dashboard, alongside your market-priced holdings. Alpaca's free
# IEX stream allows 30 symbols in total.
watchlist = ["SPY", "QQQ", "IWM", "TLT", "GLD"]
