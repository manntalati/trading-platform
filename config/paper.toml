# The paper-trading book: which library strategies trade the Alpaca paper account, with how much
# capital each. Every order still passes config/risk.toml, measured against the whole account.
# Paper only: nothing in this repository can send an order to a live account.
#
# capital   the strategy's sleeve: it sizes orders as if this were its whole account. The sleeves
#           together must fit inside the paper account's equity (Alpaca paper starts at $100k).
# approval  "auto": proposals that pass the risk checks are approved on the spot and the bot
#           (`tp-paper bot`) trades them at the next open; nothing waits for you. "manual": each
#           proposal waits for you (dashboard or `tp-paper approve`) and expires if not approved
#           by submission time. Auto is for paper only: the plan keeps a person on every order
#           once real money is involved.
# params    strategy parameters, as for `tp-backtest run NAME -p key=value`.
# sizing    optional: "fixed-fractional", "vol-target" or "kelly" to size positions with one of
#           the plan's methods (docs/risk.md); omitted, the strategy's own weights.
# regime    optional: "hmm", "trend" or "vix" to keep the strategy in cash while that regime
#           gate says the market is stressed (docs/ml.md); compare with `tp-backtest regime NAME`.
#
# Start with fewer strategies if you prefer: delete a block to stop it (its positions stay in
# the account until you sell them). Changing a sleeve's capital moves money in or out of it: it
# isn't counted as a gain or a loss, and the strategy rebalances to the new amount the next day.

[strategies.ma-timing]
capital = 18000
approval = "auto"
params = {}

[strategies.ts-momentum]
capital = 18000
approval = "auto"
params = {}

# 18000 -> 13000 on 2026-11-15 to make room for strategy 17 (IBS): the weakest live sleeve so far.
[strategies.xs-momentum]
capital = 13000
approval = "auto"
params = {}

[strategies.dual-momentum]
capital = 18000
approval = "auto"
params = {}

# 18000 -> 13000 on 2026-11-15 to make room for strategy 17 (IBS), the same kind of short-term
# index mean reversion.
[strategies.rsi2]
capital = 13000
approval = "auto"
params = {}

# Deliberately high risk: 3x leveraged ETFs, rebalanced every day, so it trades most days. A
# smaller sleeve, and its own 50% drawdown limit (config/risk.toml). Paper only.
[strategies.leveraged-momentum]
capital = 10000
approval = "auto"
params = {}

# Strategy 17: IBS mean reversion on QQQ (docs/strategies/17-ibs.md). Sleeve approved by the user
# on 2026-11-15: $10k, taken $5k each from rsi2 and xs-momentum. Entry 0.2, no turn-of-month leg.
# About 39 trades a year; idle cash sits in BIL. Its own 20% drawdown limit (config/risk.toml).
# Buys the 2% daily-loss limit blocks are logged with shadow trades: `tp-paper blocked`.
[strategies.ibs]
capital = 10000
approval = "auto"
params = {}
