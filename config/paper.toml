# The paper-trading book: which library strategies trade the Alpaca paper account, with how much
# capital each. Every order still passes config/risk.toml, measured against the whole account.
# Paper only: nothing in this repository can send an order to a live account.
#
# capital   the strategy's sleeve: it sizes orders as if this were its whole account. The sleeves
#           together must fit inside the paper account's equity (Alpaca paper starts at $100k).
# approval  "manual": each proposal waits for you (dashboard or `tp-paper approve`); anything not
#           approved by submission time expires. "auto": proposals that pass risk are approved
#           as proposed. Paper only; the plan requires a human on every live order.
# params    strategy parameters, as for `tp-backtest run NAME -p key=value`.
#
# Start with fewer strategies if you prefer: delete a block to stop it (its positions stay in
# the account until you sell them).

[strategies.ma-timing]
capital = 20000
approval = "manual"
params = {}

[strategies.ts-momentum]
capital = 20000
approval = "manual"
params = {}

[strategies.xs-momentum]
capital = 20000
approval = "manual"
params = {}

[strategies.dual-momentum]
capital = 20000
approval = "manual"
params = {}

[strategies.rsi2]
capital = 20000
approval = "manual"
params = {}
