# How holdings are grouped in the portfolio view and the ideas engine.
#
# [sectors]: single stocks -> GICS sector (asset class "US Equity").
# [funds]:   ETFs / mutual funds / money-market funds -> asset class.
# Anything not listed shows up as "Unclassified": add it here, or, for your own holdings, in
# config/classifications.local.toml (same format, git-ignored, wins over this file).

[sectors]
AAPL = "Information Technology"
MSFT = "Information Technology"
NVDA = "Information Technology"
AVGO = "Information Technology"
AMD = "Information Technology"
INTC = "Information Technology"
ORCL = "Information Technology"
CRM = "Information Technology"
ADBE = "Information Technology"
CSCO = "Information Technology"
AMZN = "Consumer Discretionary"
TSLA = "Consumer Discretionary"
HD = "Consumer Discretionary"
MCD = "Consumer Discretionary"
NKE = "Consumer Discretionary"
GOOGL = "Communication Services"
GOOG = "Communication Services"
META = "Communication Services"
NFLX = "Communication Services"
DIS = "Communication Services"
"BRK.B" = "Financials"
JPM = "Financials"
BAC = "Financials"
V = "Financials"
MA = "Financials"
UNH = "Health Care"
LLY = "Health Care"
JNJ = "Health Care"
MRK = "Health Care"
ABBV = "Health Care"
XOM = "Energy"
CVX = "Energy"
PG = "Consumer Staples"
KO = "Consumer Staples"
PEP = "Consumer Staples"
COST = "Consumer Staples"
WMT = "Consumer Staples"
CAT = "Industrials"
BA = "Industrials"

[funds]
# Broad US equity
SPY = "US Equity"
VOO = "US Equity"
IVV = "US Equity"
VTI = "US Equity"
QQQ = "US Equity"
IWM = "US Equity"
DIA = "US Equity"
FXAIX = "US Equity"   # Fidelity 500 Index
FSKAX = "US Equity"   # Fidelity Total Market Index
FZROX = "US Equity"   # Fidelity ZERO Total Market
FNILX = "US Equity"   # Fidelity ZERO Large Cap
# International equity
EFA = "International Equity"
EEM = "International Equity"
VXUS = "International Equity"
FTIHX = "International Equity"  # Fidelity Total International Index
FZILX = "International Equity"  # Fidelity ZERO International
# Bonds
IEF = "US Treasuries"
TLT = "US Treasuries"
BIL = "US Treasuries"   # 1-3 month T-bills
HYG = "Corporate Credit"
AGG = "US Bonds"
BND = "US Bonds"
FXNAX = "US Bonds"    # Fidelity US Bond Index
# Leveraged (3x daily reset): strategy 6 only
TQQQ = "Leveraged Equity"   # Nasdaq-100
UPRO = "Leveraged Equity"   # S&P 500
SOXL = "Leveraged Equity"   # semiconductors
TNA = "Leveraged Equity"    # Russell 2000
FAS = "Leveraged Equity"    # financials
TMF = "Leveraged Treasuries"  # 20+ year Treasuries
# Real assets
VNQ = "Real Estate"
DBC = "Commodities"
GLD = "Gold"
# Cash sweep / money market (also flagged by the broker as cash equivalents)
SPAXX = "Cash"
FDRXX = "Cash"
FZFXX = "Cash"
