# Backtest validation (`tp-backtest validate`): the plan's stage-1 gate before paper trading.
# See docs/backtesting.md#validation.

[periods]
# History is split in time. Explore and tune on train, choose on validation, and look at the
# locked test set once, at the end: every extra look turns it into another validation set.
train_end = "2023-06-30"
validation_end = "2024-12-31"
# Everything after validation_end is the locked test set.

[stress]
# name = [first day, last day]. Periods before the data starts are skipped (backfill more years
# with `tp-data bars backfill --years 10` to include them).
"COVID crash" = ["2020-02-19", "2020-03-23"]
"2022 rate shock" = ["2022-01-03", "2022-10-12"]
"Aug 2024 volatility spike" = ["2024-07-16", "2024-08-07"]

[walk_forward]
train_sessions = 504  # pick the variant with the best Sharpe over the last two years...
test_sessions = 126   # ...then trade it for the next six months, and repeat

[gate]
min_test_sharpe = 0.0            # positive after costs on the locked test set
min_walk_forward_sharpe = 0.0    # positive out of sample when re-chosen as it goes
min_deflated_excess = 0.0        # Sharpe above what the best of the variants tried shows by luck
stress_max_drawdown = 0.15       # a stress period survived: drawdown under 15%, or...
stress_vs_benchmark = 1.0        # ...no worse than buy-and-hold SPY's over the same days
min_neighbor_sharpe_ratio = 0.5  # every nearby parameter set keeps at least half the Sharpe

[variants]
# Parameter sets tried around each strategy's defaults (walk-forward and stability).
ma-timing = { months = [8, 9, 10, 11, 12] }
ts-momentum = { lookback = [126, 189, 252, 315] }
xs-momentum = { lookback = [126, 189, 252, 315] }
dual-momentum = { lookback = [126, 189, 252, 315] }
rsi2 = { entry = [5, 10, 15] }
leveraged-momentum = { lookback = [5, 10, 20] }
pairs = { entry = [1.5, 2.0, 2.5] }
factor = { lookback = [126, 252, 504] }
pead = { threshold = [1.5, 2.0, 3.0] }
rsi2-meta = { threshold = [0.5, 0.55, 0.6] }
