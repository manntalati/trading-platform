[project]
name = "tp-strategies"
version = "0.1.0"
description = "Strategy library: published strategies on the tp_trading contract, plus research versions."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "tp-core",
    "tp-ml",
    "tp-risk",
    "tp-trading",
    "typer>=0.12",
]

[project.scripts]
tp-ideas = "tp_strategies.cli:main"
tp-backtest = "tp_strategies.backtest_cli:main"
tp-recs = "tp_strategies.recs_cli:main"

[tool.uv.sources]
tp-core = { workspace = true }
tp-ml = { workspace = true }
tp-risk = { workspace = true }
tp-trading = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_strategies"]
