[project]
name = "tp-strategies"
version = "0.1.0"
description = "Strategy library: published strategies implemented against tp_core data."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "tp-core",
]

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_strategies"]
